name: CI

# Netlify owns deploys; this is a guard on pull requests only.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check (PR changes)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run format:check:changed -- "$BASE_SHA"

      - name: Format check (full repository)
        if: github.event_name == 'workflow_dispatch'
        run: npm run format:check

      - name: Build
        run: npm run build
