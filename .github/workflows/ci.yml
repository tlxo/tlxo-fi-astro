name: CI

# Statichost owns deploys; this workflow validates changes only.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check (PR changes)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run format:check:changed -- "$BASE_SHA"

      - name: Format check (full repository)
        if: github.event_name == 'workflow_dispatch'
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Guard against template routes
        run: |
          template_path=$(find dist \( -path '*/_template' -o -path '*/_template/*' \) -print -quit)
          if [ -n "$template_path" ]; then
            echo "A content template leaked into the build output: $template_path"
            exit 1
          fi
